name: Build iOS 6 package and Cydia repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icloudbridge6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-tests:
    name: Native Foundation policy and proxy tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline audit and repository tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Compile and execute Objective-C tests
        run: sh tests/run-native.sh

  build:
    name: armv7 iOS 6.0 deployment build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      THEOS: ${{ runner.temp }}/theos-icloudbridge6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libxml2 libtinfo5 xz-utils dpkg-dev
      - name: Install pinned Theos, toolchain and SDK
        run: bash tools/ci-bootstrap.sh
      - name: Build rootful armv7 package with legacy gzip archives
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make clean TARGET=iphone:clang:9.3:6.0 ARCHS=armv7
          PACKAGE_VERSION=$(python3 tools/ci_version.py control)
          dpkg --validate-version "$PACKAGE_VERSION"
          printf 'IB6_PACKAGE_VERSION=%s\n' "$PACKAGE_VERSION" >> "$GITHUB_ENV"
          make package FINALPACKAGE=1 PACKAGE_VERSION="$PACKAGE_VERSION" TARGET=iphone:clang:9.3:6.0 ARCHS=armv7 THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip ADDITIONAL_CFLAGS=-Werror=unguarded-availability
      - name: Validate the binary shipped inside the package
        run: |
          mapfile -t DEBS < <(find packages -maxdepth 1 -type f -name '*.deb')
          test "${#DEBS[@]}" -eq 1
          test "$(dpkg-deb --field "${DEBS[0]}" Version)" = "$IB6_PACKAGE_VERSION"
          mkdir -p build-check reports
          dpkg-deb --extract "${DEBS[0]}" build-check
          DYLIB=build-check/Library/MobileSubstrate/DynamicLibraries/iCloudBridge6.dylib
          python3 tools/validate_macho.py "$DYLIB" --output reports/binary.json
          "$THEOS/toolchain/linux/iphone/bin/otool" -L "$DYLIB" > reports/linked-libraries.txt
          "$THEOS/toolchain/linux/iphone/bin/otool" -l "$DYLIB" > reports/load-commands.txt
          "$THEOS/toolchain/linux/iphone/bin/nm" -u "$DYLIB" > reports/undefined-symbols.txt
          "$THEOS/toolchain/linux/iphone/bin/ldid" -e "$DYLIB" > reports/entitlements.plist
          sha256sum "${DEBS[0]}" > reports/SHA256SUMS
          printf 'source_commit=%s\nrun_id=%s\ndevice_tested=false\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > reports/build.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: icloudbridge6-armv7
          path: |
            packages/*.deb
            reports/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish validated Cydia repository
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [native-tests, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: icloudbridge6-armv7
          path: built
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build legacy Cydia indexes from the verified package
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mapfile -t DEBS < <(find built -type f -name '*.deb')
          test "${#DEBS[@]}" -eq 1
          python3 tools/cydia_repo.py --deb "${DEBS[0]}" --output repo --base-url "${PAGES_URL%/}/" --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cp -R built/reports repo/build-reports
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: repo
      - name: Deploy repository
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
